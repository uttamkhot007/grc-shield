# GRC Shield - Docker Compose Configuration
# For local development and on-premises deployment

version: '3.8'

services:
  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grc-shield-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://grcuser:${DB_PASSWORD:-grcpassword}@db:5432/grcshield
      - SESSION_SECRET=${SESSION_SECRET:-change-this-in-production}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - grc-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: grc-shield-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_USER=grcuser
      - POSTGRES_PASSWORD=${DB_PASSWORD:-grcpassword}
      - POSTGRES_DB=grcshield
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - grc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grcuser -d grcshield"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (optional - for session storage and caching)
  redis:
    image: redis:7-alpine
    container_name: grc-shield-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - grc-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy (optional - for production)
  nginx:
    image: nginx:alpine
    container_name: grc-shield-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - grc-network
    profiles:
      - production

networks:
  grc-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
