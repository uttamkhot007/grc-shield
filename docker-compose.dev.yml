# GRC Shield - Development Docker Compose
# Use: docker-compose -f docker-compose.dev.yml up

version: '3.8'

services:
  # Development with hot reload
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: grc-shield-dev
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://grcuser:grcpassword@db:5432/grcshield
      - SESSION_SECRET=dev-secret-change-in-production
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
    networks:
      - grc-network

  db:
    image: postgres:15-alpine
    container_name: grc-shield-db-dev
    environment:
      - POSTGRES_USER=grcuser
      - POSTGRES_PASSWORD=grcpassword
      - POSTGRES_DB=grcshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - grc-network

networks:
  grc-network:
    driver: bridge

volumes:
  postgres_dev_data:
